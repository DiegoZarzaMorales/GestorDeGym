<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StronkSystem | Terminal de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #0b0d12;
            --bg-2: #111827;
            --surface: #ffffff;
            --surface-soft: #f9fafb;
            --line: #eaecf0;
            --text: #0f172a;
            --text-muted: #667085;
            --brand: #f5c400;
            --brand-2: #d4a900;
            --accent: #f5c400;
            --ok: #13795b;
            --danger: #111827;
            --shadow-lg: 0 22px 48px rgba(16, 24, 40, 0.28);
            --shadow-md: 0 10px 20px rgba(16, 24, 40, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-1);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: none;
        }

        .pos-container {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid var(--line);
        }

        .pos-header {
            background: #111827;
            padding: 2rem 2.2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .pos-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.04);
            transform: none;
        }

        .pos-header h1 {
            color: white;
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
            position: relative;
            z-index: 1;
            text-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .logo-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.16);
            margin-right: 0.55rem;
            vertical-align: middle;
            padding: 3px;
            overflow: hidden;
        }

        .logo-pill img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .pos-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: #fde68a;
            position: relative;
            z-index: 1;
        }

        .pos-header h1 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
        }

        .pos-body {
            padding: 2rem 2.2rem;
        }

        .loading, .scanner-section, .success-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.24s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scanner-icon {
            font-size: 3.4rem;
            color: #f5c400;
            margin-bottom: 1rem;
        }

        .scanner-section h2 {
            color: var(--text);
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }

        .scanner-section p {
            color: var(--text-muted);
            margin-bottom: 1.4rem;
            font-size: 0.97rem;
        }

        .barcode-input {
            width: 100%;
            max-width: 450px;
            padding: 0.95rem 1.15rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: 1px solid #d6deea;
            border-radius: 13px;
            margin: 0 auto 1.25rem;
            display: block;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
            background: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .barcode-input:focus {
            outline: none;
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .cart-container {
            background: var(--surface-soft);
            border-radius: 16px;
            padding: 1rem;
            margin: 1rem 0;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--line);
        }

        .cart-display {
            display: none;
        }

        .cart-container::-webkit-scrollbar {
            width: 8px;
        }

        .cart-container::-webkit-scrollbar-track {
            background: #dbe3ef;
            border-radius: 10px;
        }

        .cart-container::-webkit-scrollbar-thumb {
            background: #98a2b3;
            border-radius: 10px;
        }

        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 0.8rem 0.95rem;
            margin-bottom: 0.55rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
            border: 1px solid #e5edf7;
        }

        .cart-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.2rem;
            font-size: 0.98rem;
        }

        .cart-item-details {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .cart-item-price {
            text-align: right;
            font-weight: 800;
            color: var(--ok);
            margin: 0 1rem;
            font-size: 1rem;
        }

        .btn-remove {
            background: #fef3c7;
            color: #111827;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.92rem;
            box-shadow: 0 6px 12px rgba(245, 196, 0, 0.24);
        }

        .btn-remove:hover {
            background: #fde68a;
            transform: scale(1.06);
            box-shadow: 0 10px 18px rgba(245, 196, 0, 0.28);
        }

        .cart-total {
            background: #f5c400;
            color: #111827;
            padding: 1rem 1.1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.22rem;
            font-weight: 800;
            margin-top: 0.9rem;
            box-shadow: none;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 2rem;
            color: #9ca3af;
            font-size: 1.1rem;
        }

        .quick-add {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 0.75rem;
            margin-top: 0.95rem;
        }

        .btn-quick {
            padding: 0.8rem;
            background: #eaecf0;
            color: #344054;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-quick:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-quick:active {
            transform: translateY(-1px);
        }

        .btn-quick.add {
            background: #f5c400;
            color: #111827;
            box-shadow: none;
        }

        .btn-quick.add:hover {
            box-shadow: var(--shadow-sm);
        }

        .admin-link {
            margin-top: 1.35rem;
            text-align: center;
        }

        .admin-link a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #334155;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.55rem 0.95rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .admin-link a:hover {
            color: var(--brand);
            background: #fff1f0;
        }

        .spinner {
            width: 52px;
            height: 52px;
            margin: 2rem auto;
            border: 5px solid #e5e7eb;
            border-top: 5px solid #f5c400;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 4.2rem;
            color: var(--ok);
            margin-bottom: 1rem;
        }

        .success-total {
            font-size: 2.65rem;
            font-weight: 900;
            color: #13795b;
            margin: 0.8rem 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--line);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
        }

        .success-title {
            color: var(--text);
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .success-summary {
            background: var(--surface-soft);
            padding: 1.2rem;
            border-radius: 14px;
            margin: 1rem 0;
            border: 1px solid var(--line);
        }

        .summary-head {
            border-bottom: 2px solid var(--line);
            padding: 0.7rem 0;
        }

        .summary-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .summary-value {
            color: var(--text);
            font-weight: 700;
            font-size: 1rem;
        }

        .new-sale-btn {
            width: 100%;
            font-size: 1.02rem;
            padding: 0.95rem;
        }

        .sold-line {
            padding: 0.62rem 0;
        }

        .sold-name {
            color: var(--text-muted);
            font-weight: 500;
        }

        .sold-price {
            color: var(--text);
            font-weight: 700;
            font-size: 0.98rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 11px;
            box-shadow: 0 16px 28px rgba(2, 6, 23, 0.25);
            z-index: 9999;
            animation: slideIn 0.3s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .notification.success {
            background: #13795b;
            color: white;
        }

        .notification.error {
            background: #f5c400;
            color: #111827;
        }

        .brand-watermark {
            position: fixed;
            right: 16px;
            bottom: 12px;
            color: #f5c400;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.55;
            user-select: none;
        }

        @media (max-width: 768px) {
            .pos-body {
                padding: 1.5rem 1rem;
            }

            .pos-header {
                padding: 1.5rem 1rem;
            }

            .quick-add {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="pos-container">
        <div class="pos-header">
            <h1><span class="logo-pill"><img src="{{ url_for('static', filename='img/stronksystem-gym-logo.svg') }}" alt="Logo StronkSystem"></span>StronkSystem Store</h1>
            <p>Smart POS 24/7</p>
        </div>

        <div class="pos-body">
            <!-- Pantalla de escáner -->
            <div id="scanner-screen" class="scanner-section">
                <div class="scanner-icon">
                    <i class="fas fa-barcode"></i>
                </div>
                <h2>Escanea Productos</h2>
                <p>Ingresa códigos de barras - Agrega múltiples productos al carrito</p>

                <input type="text" 
                       id="barcode-input" 
                       class="barcode-input" 
                       placeholder="BAR000001" 
                       maxlength="20"
                       autofocus>

                <div id="cart-display" class="cart-display">
                    <div class="cart-container" id="cart-items">
                        <!-- Carrito dinámico -->
                    </div>
                    
                    <div class="cart-total">
                        <span>TOTAL:</span>
                        <span id="cart-total-amount">$0.00</span>
                    </div>

                    <div class="quick-add">
                        <button class="btn-quick" id="btn-limpiar-carrito">
                            <i class="fas fa-trash"></i> Limpiar
                        </button>
                        <button class="btn-quick add" id="btn-finalizar-venta">
                            <i class="fas fa-check-circle"></i> Cobrar
                        </button>
                    </div>
                </div>

                <div class="admin-link">
                    <a href="/">
                        <i class="fas fa-lock"></i>
                        Volver al Backoffice
                    </a>
                </div>
            </div>

            <!-- Pantalla de carga -->
            <div id="loading-screen" class="loading">
                <div class="spinner"></div>
                <p class="loading-text">Procesando venta...</p>
            </div>

            <!-- Pantalla de éxito -->
            <div id="success-screen" class="success-screen">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 class="success-title">¡Venta Exitosa!</h2>
                
                <div class="success-total" id="final-total">$0.00</div>

                <div class="success-summary">
                    <div class="detail-row summary-head">
                        <span class="summary-label">Productos vendidos:</span>
                        <span class="summary-value" id="sold-count">0 items</span>
                    </div>
                    <div id="sold-items-list">
                        <!-- Lista de productos vendidos -->
                    </div>
                </div>

                <button class="btn-quick add new-sale-btn" id="btn-nueva-venta">
                    <i class="fas fa-plus-circle"></i> Nueva Venta
                </button>
            </div>
        </div>
    </div>

    <div class="brand-watermark" aria-hidden="true">GestionCorp</div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        const scannerScreen = document.getElementById('scanner-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const successScreen = document.getElementById('success-screen');
        const barcodeInput = document.getElementById('barcode-input');
        const cartDisplay = document.getElementById('cart-display');
        
        let carrito = [];

        // Auto-buscar al presionar Enter
        barcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const value = this.value.trim();
                if (value) {
                    agregarAlCarrito(value);
                    this.value = '';
                }
            }
        });

        // Botones
        document.getElementById('btn-limpiar-carrito').addEventListener('click', limpiarCarrito);
        document.getElementById('btn-finalizar-venta').addEventListener('click', finalizarVenta);
        document.getElementById('btn-nueva-venta').addEventListener('click', nuevaVenta);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault();
                finalizarVenta();
            }

            if (e.key === 'F4') {
                e.preventDefault();
                limpiarCarrito();
            }

            if (e.key === 'Escape') {
                e.preventDefault();
                nuevaVenta();
            }

            if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                barcodeInput.focus();
                barcodeInput.select();
            }
        });

        async function agregarAlCarrito(codigoBarras) {
            try {
                const response = await fetch(`${API_URL}/inventario/buscar/codigo/${codigoBarras}`);
                const result = await response.json();

                if (result.success) {
                    const producto = result.data;
                    
                    // Verificar si ya está en el carrito
                    const existente = carrito.find(item => item.id_producto === producto.id_producto);
                    
                    if (existente) {
                        if (existente.cantidad < producto.cantidad) {
                            existente.cantidad++;
                        } else {
                            mostrarNotificacion('Stock insuficiente', 'error');
                            return;
                        }
                    } else {
                        carrito.push({
                            id_producto: producto.id_producto,
                            nombre: producto.nombre,
                            precio: producto.precio,
                            cantidad: 1,
                            stock_disponible: producto.cantidad
                        });
                    }
                    
                    actualizarCarrito();
                    mostrarNotificacion(`${producto.nombre} agregado`, 'success');
                } else {
                    mostrarNotificacion('Producto no encontrado', 'error');
                }
            } catch (error) {
                mostrarNotificacion('Error de conexión', 'error');
            }
        }

        function actualizarCarrito() {
            const cartItems = document.getElementById('cart-items');
            
            if (carrito.length === 0) {
                cartDisplay.style.display = 'none';
                return;
            }
            
            cartDisplay.style.display = 'block';
            
            let total = 0;
            cartItems.innerHTML = carrito.map((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.nombre}</div>
                            <div class="cart-item-details">${item.cantidad} x $${item.precio.toFixed(2)}</div>
                        </div>
                        <div class="cart-item-price">$${subtotal.toFixed(2)}</div>
                        <button class="btn-remove" onclick="removerDelCarrito(${index})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            document.getElementById('cart-total-amount').textContent = `$${total.toFixed(2)}`;
        }

        function removerDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function limpiarCarrito() {
            if (confirm('¿Limpiar todo el carrito?')) {
                carrito = [];
                actualizarCarrito();
            }
        }

        async function finalizarVenta() {
            if (carrito.length === 0) {
                mostrarNotificacion('El carrito está vacío', 'error');
                return;
            }
            
            mostrarPantalla('loading');

            try {
                const productos = carrito.map(item => ({
                    id_producto: item.id_producto,
                    cantidad: item.cantidad
                }));

                const response = await fetch(`${API_URL}/ventas/procesar`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ productos })
                });

                const result = await response.json();

                if (result.success) {
                    mostrarExito(result.data);
                } else {
                    mostrarNotificacion(result.error, 'error');
                    mostrarPantalla('scanner');
                }
            } catch (error) {
                mostrarNotificacion('Error al procesar la venta', 'error');
                mostrarPantalla('scanner');
            }
        }

        function mostrarExito(venta) {
            document.getElementById('final-total').textContent = `$${venta.total.toFixed(2)}`;
            document.getElementById('sold-count').textContent = `${venta.productos.length} items`;
            
            const itemsList = document.getElementById('sold-items-list');
            itemsList.innerHTML = venta.productos.map(item => `
                <div class="detail-row sold-line">
                    <span class="sold-name">${item.nombre} x${item.cantidad}:</span>
                    <span class="sold-price">$${item.subtotal.toFixed(2)}</span>
                </div>
            `).join('');
            
            mostrarPantalla('success');
            
            // Auto-volver después de 4 segundos
            setTimeout(nuevaVenta, 4000);
        }

        function nuevaVenta() {
            carrito = [];
            barcodeInput.value = '';
            actualizarCarrito();
            mostrarPantalla('scanner');
            barcodeInput.focus();
        }

        function mostrarPantalla(pantalla) {
            scannerScreen.style.display = 'none';
            loadingScreen.style.display = 'none';
            successScreen.style.display = 'none';

            if (pantalla === 'scanner') {
                scannerScreen.style.display = 'block';
            } else if (pantalla === 'loading') {
                loadingScreen.style.display = 'block';
            } else if (pantalla === 'success') {
                successScreen.style.display = 'block';
            }
        }

        function mostrarNotificacion(mensaje, tipo) {
            const notif = document.createElement('div');
            notif.className = `notification ${tipo}`;
            notif.innerHTML = `
                <i class="fas fa-${tipo === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${mensaje}
            `;
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.remove();
            }, 2500);
        }

        // Mostrar pantalla inicial
        mostrarPantalla('scanner');
    </script>
</body>
</html>
