<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StronkSystem | Check-In 24/7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #0b0d12;
            --bg-2: #111827;
            --surface: #ffffff;
            --surface-soft: #f9fafb;
            --line: #eaecf0;
            --text: #0f172a;
            --text-muted: #667085;
            --brand: #f5c400;
            --brand-2: #d4a900;
            --accent: #f5c400;
            --ok: #13795b;
            --danger: #111827;
            --shadow-lg: 0 22px 48px rgba(16, 24, 40, 0.28);
            --shadow-md: 0 10px 20px rgba(16, 24, 40, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: none;
        }

        .terminal-container {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid var(--line);
        }

        .terminal-header {
            background: #111827;
            padding: 2.1rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .terminal-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.04);
            transform: none;
        }

        .terminal-logo {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 1;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.14);
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            overflow: hidden;
        }

        .terminal-logo img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .terminal-header h1 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 2.1rem;
            letter-spacing: -0.02em;
            font-weight: 800;
            margin-bottom: 0.35rem;
            position: relative;
            z-index: 1;
        }

        .terminal-header p {
            opacity: 0.88;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 600;
            color: #fde68a;
            position: relative;
            z-index: 1;
        }

        .terminal-body {
            padding: 2.1rem 1.9rem;
        }

        .welcome-screen {
            text-align: center;
        }

        .welcome-icon {
            font-size: 3.35rem;
            color: #111827;
            margin-bottom: 1rem;
        }

        .welcome-screen h2 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            color: var(--text);
            font-size: 1.65rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .welcome-screen p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1.45rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .phone-input {
            width: 100%;
            padding: 1rem 1.15rem;
            font-size: 1.4rem;
            color: #0f172a;
            text-align: center;
            border: 1px solid #d6deea;
            border-radius: 13px;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            background: #ffffff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .phone-input:focus {
            outline: none;
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-access {
            width: 100%;
            padding: 0.95rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-entrada {
            background: #f5c400;
            color: #111827;
            margin-bottom: 0.65rem;
            box-shadow: none;
        }

        .btn-entrada:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-salida {
            background: #1f2937;
            color: white;
            box-shadow: none;
        }

        .btn-salida:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .result-container {
            display: none;
            text-align: center;
            animation: fadeUp 0.24s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-icon {
            font-size: 4.25rem;
            margin-bottom: 0.85rem;
        }

        .result-icon.success {
            color: var(--ok);
        }

        .result-icon.error {
            color: var(--danger);
        }

        .result-info h2 {
            color: var(--text);
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
        }

        .result-info .member-name {
            color: var(--brand);
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 0.9rem;
        }

        .result-details {
            background: var(--surface-soft);
            border: 1px solid var(--line);
            padding: 1.15rem 1rem;
            border-radius: 14px;
            margin: 1rem 0;
            box-shadow: var(--shadow-md);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--line);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        .badge {
            display: inline-block;
            padding: 0.28rem 0.7rem;
            border-radius: 999px;
            font-size: 0.74rem;
            letter-spacing: 0.04em;
            font-weight: 700;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background: #fef3c7;
            color: #111827;
        }

        .remaining-days {
            color: var(--ok);
            font-size: 1.05rem;
            font-weight: 800;
        }

        .error-message {
            color: var(--danger);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .btn-back {
            background: #475467;
            color: white;
            padding: 0.82rem 1.4rem;
            border: none;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(51, 65, 85, 0.3);
        }

        .admin-link {
            text-align: center;
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--line);
        }

        .admin-link a {
            color: #334155;
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .admin-link a:hover {
            color: var(--brand);
            background: #fff1f0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1.5rem;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #f5c400;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fingerprint-icon {
            font-size: 2rem;
            color: #fde68a;
            opacity: 0.7;
            margin-bottom: 0.6rem;
        }

        .brand-watermark {
            position: fixed;
            right: 16px;
            bottom: 12px;
            color: #f5c400;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.55;
            user-select: none;
        }

        @media (max-width: 560px) {
            .terminal-body {
                padding: 1.5rem 1.1rem;
            }

            .terminal-header {
                padding: 1.65rem 1.1rem;
            }

            .phone-input {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-logo">
                <img src="{{ url_for('static', filename='img/stronksystem-gym-logo.svg') }}" alt="Logo StronkSystem">
            </div>
            <h1>StronkSystem</h1>
            <p>Check-In 24/7</p>
        </div>

        <div class="terminal-body">
            <!-- Pantalla de bienvenida -->
            <div id="welcome-screen" class="welcome-screen">
                <div class="fingerprint-icon">
                    <i class="fas fa-fingerprint"></i>
                </div>
                <div class="welcome-icon">
                    <i class="fas fa-hand-paper"></i>
                </div>
                <h2>¡Bienvenido!</h2>
                <p>Acceso rápido para socios</p>

                <div class="input-group">
                    <input type="tel" 
                           id="phone-input" 
                           class="phone-input" 
                           placeholder="555-1234" 
                           maxlength="15"
                           autofocus>
                </div>

                <button class="btn-access btn-entrada" id="btn-entrada">
                    <i class="fas fa-sign-in-alt"></i>
                    Registrar Entrada
                </button>

                <button class="btn-access btn-salida" id="btn-salida">
                    <i class="fas fa-sign-out-alt"></i>
                    Registrar Salida
                </button>

                <div class="admin-link">
                    <a href="/">
                        <i class="fas fa-lock"></i>
                        Volver al Backoffice
                    </a>
                </div>
            </div>

            <!-- Pantalla de carga -->
            <div id="loading-screen" class="loading">
                <div class="spinner"></div>
                <p class="loading-text">Verificando información...</p>
            </div>

            <!-- Pantalla de resultado -->
            <div id="result-screen" class="result-container">
                <div class="result-icon" id="result-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="result-info">
                    <h2 id="result-title">Entrada Registrada</h2>
                    <div class="member-name" id="member-name">Juan Pérez</div>
                    
                    <div class="result-details" id="result-details">
                        <!-- Se llenará dinámicamente -->
                    </div>
                </div>
                <button class="btn-back" id="btn-back">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
            </div>
        </div>
    </div>

    <div class="brand-watermark" aria-hidden="true">GestionCorp</div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        const welcomeScreen = document.getElementById('welcome-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const resultScreen = document.getElementById('result-screen');
        const phoneInput = document.getElementById('phone-input');

        // Permitir Enter en el input
        phoneInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-entrada').click();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F1') {
                e.preventDefault();
                document.getElementById('btn-entrada').click();
            }

            if (e.key === 'F2') {
                e.preventDefault();
                document.getElementById('btn-salida').click();
            }

            if (e.key === 'Escape') {
                e.preventDefault();
                document.getElementById('btn-back').click();
            }

            if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                phoneInput.focus();
                phoneInput.select();
            }
        });

        // Registrar entrada
        document.getElementById('btn-entrada').addEventListener('click', function() {
            registrarAcceso('ENTRADA');
        });

        // Registrar salida
        document.getElementById('btn-salida').addEventListener('click', function() {
            registrarAcceso('SALIDA');
        });

        // Volver a pantalla de inicio
        document.getElementById('btn-back').addEventListener('click', function() {
            mostrarPantalla('welcome');
            phoneInput.value = '';
            phoneInput.focus();
        });

        async function registrarAcceso(tipo) {
            const telefono = phoneInput.value.trim();
            
            if (!telefono) {
                mostrarError('Por favor ingresa tu número de teléfono');
                return;
            }

            mostrarPantalla('loading');

            try {
                const candidatos = construirTelefonosCandidatos(telefono);
                let buscarResult = { success: false };

                for (const telefonoCandidato of candidatos) {
                    const buscarResponse = await fetch(`${API_URL}/miembros/buscar/telefono/${encodeURIComponent(telefonoCandidato)}`);
                    const resultado = await buscarResponse.json();
                    if (resultado.success) {
                        buscarResult = resultado;
                        break;
                    }
                }

                if (!buscarResult.success) {
                    mostrarError('Número de teléfono no registrado.<br>Contacta al administrador.');
                    return;
                }

                const miembro = buscarResult.data;

                // Registrar acceso
                const endpoint = tipo === 'ENTRADA' ? 'entrada' : 'salida';
                const accesoResponse = await fetch(`${API_URL}/acceso/${endpoint}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id_miembro: miembro.id_miembro})
                });

                const accesoResult = await accesoResponse.json();

                if (accesoResult.success) {
                    mostrarExito(tipo, miembro);
                } else {
                    mostrarError(accesoResult.error);
                }

            } catch (error) {
                mostrarError('Error de conexión. Intenta nuevamente.');
            }
        }

        function construirTelefonosCandidatos(telefonoOriginal) {
            const candidatos = new Set();
            const limpio = telefonoOriginal.trim();
            const digitos = limpio.replace(/\D/g, '');

            if (limpio) {
                candidatos.add(limpio);
            }

            if (digitos) {
                candidatos.add(digitos);
            }

            if (digitos.length === 7) {
                candidatos.add(`${digitos.slice(0, 3)}-${digitos.slice(3)}`);
                candidatos.add(`${digitos.slice(0, 4)}-${digitos.slice(4)}`);
            }

            if (digitos.length === 10) {
                candidatos.add(`${digitos.slice(0, 3)}-${digitos.slice(3, 6)}-${digitos.slice(6)}`);
                candidatos.add(`(${digitos.slice(0, 3)}) ${digitos.slice(3, 6)}-${digitos.slice(6)}`);
            }

            return Array.from(candidatos);
        }

        function mostrarPantalla(pantalla) {
            welcomeScreen.style.display = 'none';
            loadingScreen.style.display = 'none';
            resultScreen.style.display = 'none';

            if (pantalla === 'welcome') {
                welcomeScreen.style.display = 'block';
            } else if (pantalla === 'loading') {
                loadingScreen.style.display = 'block';
            } else if (pantalla === 'result') {
                resultScreen.style.display = 'block';
            }
        }

        function mostrarExito(tipo, miembro) {
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const memberName = document.getElementById('member-name');
            const resultDetails = document.getElementById('result-details');

            // Configurar icono y título
            resultIcon.className = 'result-icon success';
            resultIcon.innerHTML = tipo === 'ENTRADA' 
                ? '<i class="fas fa-check-circle"></i>' 
                : '<i class="fas fa-door-open"></i>';
            
            resultTitle.textContent = tipo === 'ENTRADA' ? '¡Entrada Registrada!' : '¡Salida Registrada!';
            memberName.textContent = `${miembro.nombre} ${miembro.apellido}`;

            // Detalles
            let detallesHTML = '';
            const ahora = new Date();
            
            detallesHTML += `
                <div class="detail-item">
                    <span class="detail-label">Hora:</span>
                    <span class="detail-value">${ahora.toLocaleTimeString('es-ES')}</span>
                </div>
            `;

            if (miembro.suscripcion) {
                const estadoBadge = miembro.suscripcion.activa 
                    ? '<span class="badge badge-success">ACTIVA</span>' 
                    : '<span class="badge badge-danger">VENCIDA</span>';
                
                detallesHTML += `
                    <div class="detail-item">
                        <span class="detail-label">Suscripción:</span>
                        <span class="detail-value">${estadoBadge}</span>
                    </div>
                `;

                if (miembro.suscripcion.activa) {
                    detallesHTML += `
                        <div class="detail-item">
                            <span class="detail-label">Días restantes:</span>
                            <span class="detail-value remaining-days">
                                ${miembro.suscripcion.dias_restantes} días
                            </span>
                        </div>
                    `;
                }
            } else {
                detallesHTML += `
                    <div class="detail-item">
                        <span class="detail-label">Suscripción:</span>
                        <span class="detail-value"><span class="badge badge-danger">Sin suscripción</span></span>
                    </div>
                `;
            }

            resultDetails.innerHTML = detallesHTML;
            mostrarPantalla('result');

            // Auto-volver después de 5 segundos
            setTimeout(() => {
                mostrarPantalla('welcome');
                phoneInput.value = '';
                phoneInput.focus();
            }, 5000);
        }

        function mostrarError(mensaje) {
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const memberName = document.getElementById('member-name');
            const resultDetails = document.getElementById('result-details');

            resultIcon.className = 'result-icon error';
            resultIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
            resultTitle.textContent = 'Error';
            memberName.textContent = '';
            resultDetails.innerHTML = `<p class="error-message">${mensaje}</p>`;

            mostrarPantalla('result');

            // Auto-volver después de 3 segundos
            setTimeout(() => {
                mostrarPantalla('welcome');
                phoneInput.value = '';
                phoneInput.focus();
            }, 3000);
        }
    </script>
</body>
</html>
